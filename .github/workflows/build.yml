name: Build THE PARALLEL

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build mod
        run: bash ./gradlew --no-daemon --stacktrace clean build
      - name: Upload build output (success)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: theparallel-forge-26.2
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
      - name: Upload diagnostics (failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: theparallel-build-diagnostics
          path: |
            build/reports/**
            build/test-results/**
          if-no-files-found: ignore
          retention-days: 7
